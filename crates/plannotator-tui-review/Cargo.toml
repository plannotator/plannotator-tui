[package]
name = "plannotator-tui-review"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["code-review", "git", "diff", "annotation", "agents"]
categories = ["development-tools"]
description = "Git diff capture, code-review notes, anchoring and agent feedback for plannotator-tui."

[dependencies]
plannotator-tui-schema = { path = "../plannotator-tui-schema", version = "0.11.6" }
regex = "1"
serde.workspace = true
serde_json.workspace = true
sha2 = "0.11.0"
time = { version = "0.3", features = ["parsing"] }

[target.'cfg(unix)'.dependencies]
# Already in the tree through crossterm; kills a git command's process group (src/children.rs).
rustix = { version = "1", features = ["process"] }

[lints]
workspace = true
