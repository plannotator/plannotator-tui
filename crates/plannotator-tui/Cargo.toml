[package]
name = "plannotator-tui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Annotate Markdown in the terminal - standalone, and as a Herdr plugin."
readme = "../../README.md"
keywords = ["tui", "markdown", "annotation", "review", "agents"]
categories = ["command-line-utilities", "text-processing"]

[[bin]]
name = "plannotator-tui"
path = "src/main.rs"

[dependencies]
plannotator-tui-schema = { path = "../plannotator-tui-schema", version = "0.9.11" }
plannotator-tui-hosts = { path = "../plannotator-tui-hosts", version = "0.9.11" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
similar.workspace = true
toml.workspace = true
unicode-width.workspace = true
time = { version = "0.3", features = ["formatting", "parsing", "local-offset"] }
pulldown-cmark = { version = "0.13.4", default-features = false }
ratatui = "0.30"
# highlight-code pulls syntect + a C oniguruma build; plain code blocks keep the build pure Rust.
tui-markdown = { version = "0.3.9", default-features = false }
# OSC 11 by hand is forty lines and a dozen terminal quirks; this reads the reply off its own
# tty handle, so it cannot race the event loop's reader. Three small crates, one author.
terminal-colorsaurus = "1.0.3"

[target.'cfg(unix)'.dependencies]
# Already in the tree through crossterm; polls the terminal for a hang-up (src/hangup.rs).
rustix = { version = "1", features = ["event", "stdio", "termios"] }

[dev-dependencies]
rusqlite = { version = "0.31.0", features = ["bundled"] }

[target.'cfg(unix)'.dev-dependencies]
rustix = { version = "1", features = ["pty"] }

[lints]
workspace = true
