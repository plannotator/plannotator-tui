[package]
name = "plannotator-tui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Annotate Markdown in the terminal - standalone, and as a Herdr plugin."
readme = "../../README.md"
keywords = ["tui", "markdown", "annotation", "review", "agents"]
categories = ["command-line-utilities", "text-processing"]

[[bin]]
name = "plannotator-tui"
path = "src/main.rs"

[dependencies]
plannotator-tui-schema = { path = "../plannotator-tui-schema", version = "0.11.1" }
plannotator-tui-hosts = { path = "../plannotator-tui-hosts", version = "0.11.1" }
plannotator-tui-review = { path = "../plannotator-tui-review", version = "0.11.1" }
anyhow.workspace = true
# The Pi link's per-process token (src/pi.rs). Already in the tree through dev-dependencies.
getrandom = "0.3"
serde.workspace = true
serde_json.workspace = true
similar.workspace = true
toml.workspace = true
# Writes the review settings back into the config file, keeping its comments and layout.
unicode-width.workspace = true
time = { version = "0.3", features = ["formatting", "parsing", "local-offset"] }
pulldown-cmark = { version = "0.13.4", default-features = false }
ratatui = "0.30"
# highlight-code pulls syntect + a C oniguruma build; plain code blocks keep the build pure Rust.
tui-markdown = { version = "0.3.9", default-features = false }
# Code-block colouring: the grammar engine diffs-rs is built on, and its bundled grammars. Both
# are pure Rust (fancy-regex, no oniguruma), so unlike diffs-rs itself they build on Windows.
# Version and features match what diffs-rs asks for, so Unix builds share one copy.
syntect = { package = "diffs-syntect", version = "0.1.0", default-features = false, features = ["parsing", "dump-load", "regex-fancy"] }
two-face = { package = "diffs-two-face", version = "0.1.0", default-features = false, features = ["syntect-fancy"] }
# OSC 11 by hand is forty lines and a dozen terminal quirks; this reads the reply off its own
# tty handle, so it cannot race the event loop's reader. Three small crates, one author.
terminal-colorsaurus = "1.0.3"

[target.'cfg(unix)'.dependencies]
# Already in the tree through crossterm; polls the terminal for a hang-up (src/hangup.rs) and
# names it for `last --stdin` (src/last/mod.rs).
rustix = { version = "1", features = ["event", "fs", "stdio", "termios"] }
# The diff viewer behind `plannotator-tui review` (src/review/). Unix only: its patch reader is.
# Default features off: `dev-tty` would switch crossterm, for this whole build, to reading
# /dev/tty, and `clipboard` is its own macOS clipboard; this app owns its input and copies.
diffs-rs = { version = "0.2.2", default-features = false }

[dev-dependencies]
rusqlite = { version = "0.31.0", features = ["bundled"] }

[target.'cfg(unix)'.dev-dependencies]
rustix = { version = "1", features = ["pty"] }

[lints]
workspace = true
