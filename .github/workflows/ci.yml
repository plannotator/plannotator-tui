# Pull-request gate: the full suite on Ubuntu and Windows, plus the static musl release binary
# smoke-tested on old glibc and Alpine. The jobs run in parallel and are cancelled when the PR
# is updated.
name: ci

on:
  pull_request:
  merge_group:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: python3 herdr/test-manifest.py
      - run: cargo build --release -p plannotator-tui
      - run: bash herdr/stage-plannotator-tui.sh
      - run: cmp target/release/plannotator-tui herdr/bin/plannotator-tui.exe
      - run: ./herdr/bin/plannotator-tui.exe --version

  # Same build and smoke test as the musl entry in release.yml, so a break shows up here
  # rather than on release day.
  musl:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release -p plannotator-tui --target x86_64-unknown-linux-musl
      - run: sh scripts/smoke-musl-containers.sh target/x86_64-unknown-linux-musl/release/plannotator-tui

  check-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --all-targets
      - run: cargo build --release -p plannotator-tui
      - run: '& .\target\release\plannotator-tui.exe --version'
      - run: python herdr/test-manifest.py
      - run: powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File herdr/stage-plannotator-tui.ps1
      - run: |
          $source = (Get-FileHash .\target\release\plannotator-tui.exe).Hash
          $staged = (Get-FileHash .\herdr\bin\plannotator-tui.exe).Hash
          if ($source -ne $staged) { throw "staged binary differs from Cargo output" }
      - run: '& .\herdr\bin\plannotator-tui.exe --version'
