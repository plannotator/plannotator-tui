[workspace]
resolver = "3"
members = ["crates/plannotui-schema", "crates/plannotui"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"
repository = "https://github.com/ramos/plannotui"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "3"
unicode-width = "0.2"

# Strict by default. Everything below is either a real defect class we want caught
# or a pedantic lint that has already paid for itself in this codebase.
[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Defect classes, not style:
unwrap_used = "warn"
expect_used = "warn"
indexing_slicing = "warn"
panic = "warn"
dbg_macro = "warn"
todo = "warn"
print_stdout = "warn"
print_stderr = "warn"
# Pedantic allows that only add noise in an application:
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"

[profile.release]
debug = 1
lto = "thin"
