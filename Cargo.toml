[workspace]
resolver = "3"
members = [
    "crates/plannotator-tui-schema",
    "crates/plannotator-tui-hosts",
    "crates/plannotator-tui-review",
    "crates/plannotator-tui",
]

[workspace.package]
version = "0.10.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"
repository = "https://github.com/ramos/plannotator-tui"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "3"
toml = { version = "1", default-features = false, features = ["std", "serde", "parse", "display"] }
unicode-width = "0.2"

# Strict by default. Everything below is either a real defect class we want caught
# or a pedantic lint that has already paid for itself in this codebase.
[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Defect classes, not style:
unwrap_used = "warn"
expect_used = "warn"
indexing_slicing = "warn"
panic = "warn"
dbg_macro = "warn"
todo = "warn"
print_stdout = "warn"
print_stderr = "warn"
# Pedantic allows that only add noise in an application:
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"

[profile.release]
lto = "thin"
# Shipped binaries carry no debug info; profile locally with `--profile profiling`.
strip = true

[profile.profiling]
inherits = "release"
debug = 1
strip = false

# TEMPORARY: the viewed ticks use `Engine::set_file_marks` (plannotator/diffs-rs#12, merged)
# and the review draws on the terminal background with `Engine::set_terminal_background`
# (plannotator/diffs-rs#13, branch feat/terminal-background, not merged yet). Neither is in a
# diffs-rs release; this points at the #13 commit.
# Once diffs-rs 0.2.1 is on crates.io: delete this section, set
# `diffs-rs = { version = "0.2.1", default-features = false }` in
# crates/plannotator-tui/Cargo.toml, and run `cargo update -p diffs-rs`.
[patch.crates-io]
diffs-rs = { git = "https://github.com/plannotator/diffs-rs", rev = "0d18510a1f1c9b16dc114e1cd90c388a4069ee1c" }
