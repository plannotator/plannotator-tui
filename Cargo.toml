[workspace]
resolver = "3"
members = ["crates/plannotui-schema", "crates/plannotui"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/ramos/plannotui"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "3"
unicode-width = "0.2"
